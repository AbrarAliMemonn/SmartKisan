services:
  # ========================================================
  # MySQL Database
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: smartkisan-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_service_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # Apache Kafka (KRaft Mode)
  # ========================================================
  kafka:
    image: apache/kafka:latest
    container_name: smartkisan-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ========================================================
  # Eureka Discovery Server
  # ========================================================
  eureka-server:
    build: ./backend/eureka-server
    container_name: smartkisan-eureka
    restart: always
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  # ========================================================
  # API Gateway
  # ========================================================
  api-gateway:
    build: ./backend/api-gateway
    container_name: smartkisan-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://eureka-server:8761/eureka
      FRONTEND_URL: http://localhost:3000

  # ========================================================
  # Auth Service
  # ========================================================
  auth-service:
    build: ./backend/auth-service
    container_name: smartkisan-auth
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: auth_service_db
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BROKER: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-980181280327-hfu38o3stk8bpuj6k9p1njhi1kfrnhv5.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      MAIL_USERNAME: ${MAIL_USERNAME:-smartagriculture076@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-rwngyxispdsecrvt}

  # ========================================================
  # Marketplace Service (with Socket.IO)
  # ========================================================
  marketplace-service:
    build: ./backend/marketplace-service
    container_name: smartkisan-marketplace
    restart: always
    ports:
      - "8082:8082"
      - "9099:9099"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: marketplace_service_db
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BROKER: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka

  # ========================================================
  # Weather Service
  # ========================================================
  weather-service:
    build: ./backend/weather-service
    container_name: smartkisan-weather
    restart: always
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8084
      EUREKA_URL: http://eureka-server:8761/eureka

  # ========================================================
  # IoT Sensor Telemetry Service
  # ========================================================
  iot-service:
    build: ./backend/iot-service
    container_name: smartkisan-iot
    restart: always
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - kafka
    environment:
      SERVER_PORT: 8085
      EUREKA_URL: http://eureka-server:8761/eureka
      KAFKA_BROKER: kafka:9092

  # ========================================================
  # Multilingual AgricultureBot Service
  # ========================================================
  chatbot-service:
    build: ./backend/chatbot-service
    container_name: smartkisan-chatbot
    restart: always
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
    environment:
      SERVER_PORT: 8086
      EUREKA_URL: http://eureka-server:8761/eureka

  # ========================================================
  # Frontend (SmartKisan React 19 + Nginx)
  # ========================================================
  frontend:
    build: ./frontend
    container_name: smartkisan-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
  kafka-data:
