# ============================================
# Application
# ============================================
spring.application.name=marketplace-service

  # ============================================
  # MySQL Datasource
  # ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marketplace_service_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

  # HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

  # ============================================
  # JPA / Hibernate
  # ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

  # ============================================
  # Jackson
  # ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

  # ============================================
  # Kafka
  # ============================================
spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}

spring.kafka.listener.auto-startup=true

  # Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

  # Kafka Consumer
spring.kafka.consumer.group-id=marketplace-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartagri.kafka.event

  # ============================================
  # File uploads (product images, store logos, payment proofs)
  # ============================================
  # Local folder on the server where uploaded images are written.
  # Override with APP_UPLOAD_DIR in Docker / production.
app.upload.dir=${APP_UPLOAD_DIR:uploads}

  # Public URL prefix that is returned to the frontend for a stored file.
  # Must match MediaController's GET mapping, including the /api context path.
  # Behind the API Gateway, override with the gateway origin, e.g.
  # http://localhost:8080/api/marketplace/media/files
app.upload.public-base-url=${APP_UPLOAD_PUBLIC_BASE_URL:/api/marketplace/media/files}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:25MB}

  # ============================================
  # Server
  # ============================================
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/api
server.error.include-message=always

  # ============================================
  # Eureka Client
  # ============================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

  # ============================================
  # CORS
  # ============================================
#app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

  # ============================================
  # JWT
  # ============================================
app.jwt.secret=${JWT_SECRET:c21hcnRhZ3JpLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
app.jwt.issuer=smart-agriculture-platform

  # ============================================
  # Application Kafka Topics
  # ============================================
app.kafka.topics.order-events=order-events-topic
app.kafka.topics.notifications=notifications-topic

  # ============================================
  # Socket.IO
  # ============================================
socketio.host=0.0.0.0
socketio.port=${SOCKETIO_PORT:9099}

  # ============================================
  # Logging
  # ============================================
logging.level.root=INFO
logging.level.com.smartagri=DEBUG

  # ============================================
  # Actuator
  # ============================================
management.endpoints.web.exposure.include=health,info