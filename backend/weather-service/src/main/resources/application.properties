# ============================================
# Application
# ============================================
spring.application.name=weather-service
  
  # ============================================
  # Jackson
  # ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
  
  # ============================================
  # Server
  # ============================================
server.port=${SERVER_PORT:8084}
server.servlet.context-path=/api
server.error.include-message=always
  
  # ============================================
  # Eureka Client
  # ============================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
  
  # ============================================
  # Application JWT
  # ============================================
app.jwt.secret=${JWT_SECRET:c21hcnRhZ3JpLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
app.jwt.issuer=smart-agriculture-platform
  
  # ============================================
  # Weather API
  # ============================================
app.weather.api-key=${OPENWEATHER_API_KEY:ff1c67cad2764d1aa8f6ad9a39f3d7}
  
  # ============================================
  # Logging
  # ============================================
logging.level.root=INFO
logging.level.com.smartagri=DEBUG
  
  # ============================================
  # Actuator
  # ============================================
management.endpoints.web.exposure.include=health,info

