# ============================================
# AgricultureBot Microservice
# ============================================
spring.application.name=chatbot-service

server.port=${SERVER_PORT:8086}
server.servlet.context-path=/api
server.error.include-message=always

# Multipart file upload configuration for media diagnosis
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Optional Google Gemini API Key for Vision & LLM
gemini.api-key=${GEMINI_API_KEY:}

# Actuator
management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.com.smartagri=DEBUG
