# =========================================================
# Server
# =========================================================
server.port=${SERVER_PORT:8080}

# =========================================================
# Application
# =========================================================
spring.application.name=api-gateway

# =========================================================
# Gateway Discovery
# =========================================================
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# =========================================================
# CORS
# =========================================================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_URL:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

# =========================================================
# Routes
# =========================================================

# Authentication
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/oauth2/**,/api/login/**
#spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Users
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

# Admin
spring.cloud.gateway.server.webflux.routes[2].id=admin-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/admin/**

# Marketplace
spring.cloud.gateway.server.webflux.routes[3].id=marketplace-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://marketplace-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/marketplace/**

# IoT & Crops
spring.cloud.gateway.server.webflux.routes[4].id=iot-crop-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://iot-crop-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/iot/**,/api/crops/**

# Weather
spring.cloud.gateway.server.webflux.routes[5].id=weather-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://weather-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/weather/**

# News
spring.cloud.gateway.server.webflux.routes[6].id=news-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://news-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/news/**

# Chatbot
spring.cloud.gateway.server.webflux.routes[7].id=chatbot-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://chatbot-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/chatbot/**

# Expert
spring.cloud.gateway.server.webflux.routes[8].id=expert-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://expert-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/experts/**

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info,gateway

# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.cloud.gateway=INFO