# ============================================
# IoT & Crop Microservice
# ============================================
spring.application.name=iot-crop-service

server.port=${SERVER_PORT:8085}
server.servlet.context-path=/api
server.error.include-message=always

# ============================================
# Eureka Discovery Client
# ============================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ============================================
# Kafka Producer
# ============================================
spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topics.sensor-events=iot-sensor-events-topic

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.com.smartagri=DEBUG
