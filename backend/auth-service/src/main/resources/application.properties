# =========================================================
# Environment variables / secrets
# ---------------------------------------------------------
# Secrets live in the .env file in the project root (NOT committed to git).
# Real OS environment variables work too and take priority over .env.
# See .env.example for the full list.
# =========================================================
spring.config.import=optional:file:.env[.properties]


# =========================================================
# Application
# =========================================================
spring.application.name=auth-service


# =========================================================
# Database - MySQL
# =========================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_service_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false


# =========================================================
# Jackson
# =========================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false


# =========================================================
# Kafka - OTP emails are published as events and sent by a consumer.
# Set KAFKA_ENABLED=false to skip Kafka and send OTP mails directly.
# =========================================================
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.topics.otp-email=otp-email-events-topic

spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}

# Producer (fail fast when the broker is down so the SMTP fallback kicks in)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000

# Consumer
spring.kafka.consumer.group-id=auth-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.smartagri.kafka.event.OtpEmailEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartagri.kafka.event


# =========================================================
# Google OAuth2
# =========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token


# =========================================================
# Mail - Gmail SMTP (used for OTP emails)
# MAIL_PASSWORD must be a Google "App Password", not the normal Gmail password.
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Gmail being unreachable must not mark the whole service DOWN
management.health.mail.enabled=false


# =========================================================
# Server
# =========================================================
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api
server.error.include-message=always


# =========================================================
# Eureka Client
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true


# =========================================================
# Application Configuration
# =========================================================

# CORS is handled by the API Gateway
# app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP:3600000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP:604800000}
app.jwt.issuer=smart-agriculture-platform

# OAuth2
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

# Public OAuth callback URL exposed through API Gateway
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/login/oauth2/code/google

# Make Spring Security understand forwarded requests from API Gateway
server.forward-headers-strategy=framework

# OTP / email
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.mail.from-name=${MAIL_FROM_NAME:Smart Agriculture}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}


# =========================================================
# Logging
# =========================================================
logging.level.root=INFO
logging.level.com.smartagri=DEBUG


# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info
